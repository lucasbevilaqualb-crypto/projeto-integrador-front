<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creche Pet — Agenda da Creche</title>
<link rel="stylesheet" href="../css/estilo.css">
</head>
<body class="pagina-app">

<header class="barra-superior">
  <button class="logotipo-app" id="botao-logo"><img src="../src/logo.png" alt="Creche Pet"></button>
  <div class="area-usuario">
    <button class="botao-sino" id="botao-sino">
      <img src="../src/icone-sino.png" alt="Notificações">
      <div class="painel-notificacoes oculto" id="painel-notificacoes"><strong>Notificações</strong>Nenhuma novidade por enquanto.</div>
    </button>
    <span class="nome-usuario-atual" id="nome-usuario"></span>
    <div class="avatar-usuario" id="avatar-usuario"></div>
    <button class="botao-logout" id="botao-sair"><img src="../src/icone-sair.png" alt="Sair"></button>
  </div>
</header>

<div class="area-conteudo fundo-patinhas">
  <div class="container-largura">
    <h1 class="titulo-secao">Agenda da Creche</h1>
    <p class="subtitulo-secao" id="meta-agenda-creche"></p>
    <div class="linha-stats">
      <div class="cartao-stat cor-azul"><div class="numero-stat" id="stat-capacidade">0</div><div class="legenda-stat">Capacidade total<br>vagas por dia</div></div>
      <div class="cartao-stat cor-laranja"><div class="numero-stat" id="stat-ocupadas">0</div><div class="legenda-stat">Vagas ocupadas<br>hoje</div></div>
      <div class="cartao-stat cor-verde"><div class="numero-stat" id="stat-livres">0</div><div class="legenda-stat">Vagas livres<br>disponíveis</div></div>
    </div>
    <h3 class="titulo-lista">Agendamentos de hoje</h3>
    <div id="lista-agendamentos-creche"></div>
  </div>
</div>

<script src="../js/armazenamento.js"></script>
<script src="../js/aplicativo.js"></script>
<script>iniciarPaginaAgendaCreche();</script>
</body>
</html>
